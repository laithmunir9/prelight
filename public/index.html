  <style id="legacyStyles" media="not all">
    :root {
      --bad: #c0453a;
      --r: 20px;
      --shadow: 0 24px 60px rgba(39,45,70,.12);
      --ink: rgba(39,45,70,.56);
      --rm-header-bg: rgba(255,253,248,.9);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--rm-ink);
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(200,213,223,.24), transparent 55%),
        radial-gradient(800px 460px at 100% 10%, rgba(233,177,126,.18), transparent 50%),
        var(--rm-bg);

    .shell { min-height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative;
      padding: 16px 32px; border-bottom: 2px solid var(--ink);
      background: var(--rm-header-bg); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 20;
    }
    .theme-toggle {
      position: relative; z-index: 0;
      width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      background: transparent; transition: .15s transform;
    }
    .theme-toggle::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: var(--rm-panel); border: 2px solid var(--ink); filter: url(#sketchWobble);
    }
    .theme-toggle:hover { transform: rotate(-8deg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .header-user { line-height: 1.3; }
    .header-user-menu { position: relative; }
    .header-user-trigger {
      appearance: none; border: none; background: transparent; padding: 2px 8px; min-width: 128px;
      color: inherit; cursor: pointer; font: inherit; text-align: center;
    }
    .header-user-main { display: block; }
    .header-user b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 14px; color: var(--rm-teal-dark); }
    .header-user span { display: block; font-size: 11px; color: var(--rm-muted); }
    .header-user-trigger:hover b, .header-user-trigger:focus-visible b { color: var(--rm-teal); }
    .header-user-trigger:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; border-radius: 6px; }
    .header-user-popover {
      position: absolute; right: 0; top: calc(100% + 10px); min-width: 142px; padding: 10px;
      background: var(--rm-panel); border: 2px solid var(--ink); border-radius: 10px;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(-4px);
      transition: .15s opacity, .15s transform;
    }
    .header-user-menu.open .header-user-popover { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .header-user-popover .logout-link { display: block; width: 100%; padding: 5px 4px; text-align: center; }
    .logout-link {
      appearance: none; border: none; background: transparent; padding: 0;
      color: var(--rm-muted); cursor: pointer; font: inherit; font-size: 11px;
      line-height: 1.2; text-decoration: underline; text-underline-offset: 2px;
    }
    .logout-link:hover { color: var(--rm-teal-dark); }
    .logout-link:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; border-radius: 4px; }
    .founder-link {
      appearance: none; border: none; background: transparent; padding: 0;
      color: var(--rm-muted); cursor: pointer; font: inherit; font-size: 12px;

    .founder-link:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 3px; border-radius: 5px; }
    .brand {
      display: flex; align-items: center; gap: 12px; position: relative;
      border: none; background: transparent; padding: 0; font: inherit; text-align: left; cursor: pointer;
    }
    .brand:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 4px; border-radius: 8px; }
    .brand-wash { position: absolute; left: -10px; top: -12px; width: 56px; height: 56px; z-index: 0; pointer-events: none; }

    .brand-text p { margin: 2px 0 0; color: var(--rm-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    body.landing-page { background: var(--landing-bg); }
    body.landing-page header { position: absolute; inset: 0 0 auto; min-height: 0; padding: 20px 28px; border: 0; background: transparent; backdrop-filter: none; justify-content: space-between; }
    body.landing-page .brand { display: none; }
    body.landing-page .theme-toggle { display: flex; }
    body.landing-page .founder-link { position: static; transform: none; color: var(--landing-muted); font-size: 11px; }
    .rm-landing { display: grid; min-height: 100vh; place-items: center; padding: 90px 24px 42px; background: var(--landing-bg); color: var(--landing-ink); }
    .rm-landing-inner { width: min(420px, 100%); text-align: center; }
    .rm-landing-logo { width: 52px; height: 52px; margin: 0 auto 18px; }
    .rm-landing-brand { margin: 0; color: var(--landing-ink); font: 600 25px Fraunces, Georgia, serif; }
    .rm-live-stage { position: relative; width: min(300px, 100%); margin: 30px auto 24px; padding: 24px 20px 12px; }
    .rm-live-stage::before { content: ""; position: absolute; inset: 0; z-index: -1; border: 2px solid var(--landing-line); border-radius: 18px; filter: url(#sketchWobble); }
    .rm-live-stage svg { width: 100%; height: auto; display: block; }
    .rm-live-bubble { position: absolute; top: -13px; right: -18px; max-width: 132px; padding: 9px 12px; border-radius: 11px; background: var(--landing-panel); color: var(--landing-bubble-ink); box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 12px; line-height: 1.3; animation: liveFloat 3s ease-in-out infinite; }
    .rm-live-bubble::after { content: ""; position: absolute; left: 18px; bottom: -7px; border: 7px solid transparent; border-top-color: var(--landing-panel); border-bottom: 0; }
    .rm-landing h2 { margin: 0; color: var(--landing-ink); font: 500 clamp(29px, 4.2vw, 38px)/1.12 Fraunces, Georgia, serif; }
    .rm-landing-copy { margin: 13px auto 0; color: var(--landing-muted); font-size: 14px; line-height: 1.55; }
    .rm-landing-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .rm-landing-btn { min-height: 46px; border: 1px solid var(--landing-line-strong); border-radius: 7px; padding: 0 16px; background: transparent; color: var(--landing-ink); cursor: pointer; font: 600 14px "IBM Plex Sans", sans-serif; }
    .rm-landing-btn.primary { border-color: var(--landing-accent); background: var(--landing-accent); color: var(--landing-accent-ink); }
    .rm-landing-btn:hover { transform: translateY(-1px); }
    .rm-landing-note { margin: 16px 0 0; color: var(--landing-note); font-size: 11px; }
    .rm-auth-backdrop { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgba(12, 15, 31, .8); backdrop-filter: blur(7px); }
    .rm-auth-dialog { width: min(420px, 100%); position: relative; padding: 28px; background: #f8f0e5; color: #2a314f; border: 2px solid rgba(42, 49, 79, .75); border-radius: 12px; box-shadow: 0 28px 80px rgba(0,0,0,.36); }
    .rm-auth-dialog h2 { margin: 0; color: #2a314f; font-size: 28px; }
    .rm-auth-dialog .sub { margin: 8px 0 20px; color: rgba(42, 49, 79, .72); line-height: 1.5; }
    .rm-auth-dialog label { color: rgba(42, 49, 79, .78); }
    .rm-auth-dialog .input-wrap input { background: #fffdf8; border-color: rgba(42, 49, 79, .45); color: #2a314f; caret-color: #2a314f; }
    .rm-auth-dialog .input-wrap input::placeholder { color: rgba(42, 49, 79, .48); }
    .rm-auth-dialog .actions { margin-top: 20px; }
    .rm-auth-dialog .btn.primary { background: #2a314f; color: #fff9ec; border-color: #2a314f; }
    .rm-auth-dialog .btn.ghost { color: #2a314f; border-color: rgba(42, 49, 79, .55); }
    .rm-auth-close { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; border: 0; background: transparent; color: #2a314f; cursor: pointer; font-size: 22px; }
    @keyframes liveFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .rm-modal-backdrop {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
      padding: 24px; background: rgba(27,36,32,.42); backdrop-filter: blur(6px);
    }
    .rm-founder-modal {
      position: relative; z-index: 0; width: min(560px, 100%); padding: 28px;
      color: var(--rm-ink);
    }
    .rm-founder-modal::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px;
      background: var(--rm-panel); border: 2.5px solid var(--ink);
      box-shadow: var(--shadow); filter: url(#sketchWobbleBold);
    }
    .rm-founder-modal h2 {
      margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-weight: 600;
      font-size: 26px; color: var(--rm-teal-dark);
    }
    .rm-founder-modal p { margin: 0 0 12px; color: var(--rm-ink); line-height: 1.65; font-size: 15px; }
    .rm-founder-modal .signoff { color: var(--rm-muted); font-size: 13px; margin-bottom: 0; }
    .rm-modal-close {
      position: absolute; top: 12px; right: 14px; width: 30px; height: 30px;
      border-radius: 50%; border: none; background: transparent; cursor: pointer;
      color: var(--rm-muted); font-size: 18px; line-height: 30px;
    }
    .rm-modal-close:hover { color: var(--rm-teal-dark); }
    .rm-modal-close:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .fill-gate {
      flex: 1; display: grid; place-items: center; padding: 32px;
      min-height: calc(100vh - 76px);
    }
    /* Sketch-shape convention: the visible box (fill/border/shadow) lives on
       an empty ::before, and only that pseudo-element gets the wobble filter.
       CSS filters rasterize the whole subtree they're applied to, so putting
       the filter directly on an element with text children would blur/warp
       the text itself - the element with real content stays filter-free and
       sits on top (z-index) of its own decorative ::before. */
    .card {
      position: relative; z-index: 0;
      padding: 30px; width: min(440px, 100%);
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-panel); border: 2px solid var(--ink); border-radius: var(--r);
      box-shadow: var(--shadow);
      filter: url(#sketchWobbleBold);
    }
    h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; color: var(--rm-teal-dark); }
    .sub { color: var(--rm-muted); line-height: 1.55; margin: 0 0 22px; font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 12.5px; color: var(--rm-muted); margin-bottom: 14px; }
    .input-wrap { position: relative; z-index: 0; }
    .input-wrap::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--rm-input-bg); border: 2px solid var(--ink); border-radius: 10px;
      filter: url(#sketchWobble);
    }
    .input-wrap.pill::before { border-radius: 999px; }
    .input-wrap input, .input-wrap textarea {
      position: relative; z-index: 1; display: block;
      width: 100%; padding: 12px 14px; border: none; background: transparent;
      color: var(--rm-ink); font: inherit; font-size: 15px; box-sizing: border-box;
    }
    .input-wrap textarea { min-height: 70px; font-size: 14px; resize: vertical; }
    input:focus-visible, .btn:focus-visible { outline: 2px solid var(--rm-teal); outline-offset: 2px; }
    .btn {
      position: relative; z-index: 0;
      appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 600;
      border-radius: 999px; padding: 12px 20px; font-size: 14px; transition: .15s transform;
      background: transparent;
    }
    .btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px;
      filter: url(#sketchWobble);
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px) rotate(-0.4deg); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #2b1f0d; }
    .primary::before { background: linear-gradient(135deg, #f3d19c, var(--rm-tan)); border: 2px solid var(--ink); }
    .ghost { color: var(--rm-teal-dark); }
    .ghost::before { background: transparent; border: 2px solid var(--ink); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .muted { color: var(--rm-muted); font-size: 13px; }
    .err {
      position: relative; z-index: 0;
      color: var(--bad); padding: 12px 14px; font-size: 13px; margin-top: 12px;
    }
    .err::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px;
      background: rgba(192,69,58,.08); border: 2px solid var(--bad);
      filter: url(#sketchWobble);
    }

      --rm-panel: #fffdfa;

    .rm-topbar { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }

<script src="/micTranscriptAccumulator.js"></script>

<script>
const S = {
  token: localStorage.getItem("greenRoomToken") || "",
  student: null,
  screen: "studio",
  authMode: "register",
  practiceTemplate: null,
  practiceSessionId: null,
  replaySession: null,
  replayLoading: false,
  replayReturnScreen: "picker",
  profile: null,
  profileLoading: false,
  profileError: null,
  activeQuest: null,
  challengeModifier: null,
  questCompleted: false,
  newlyUnlockedModifier: null,
  practiceLog: [],
  micOn: false,
  micStartedAt: 0,
  camDismissed: false,
  sending: false,
  rubric: null,
  viaFreeText: false,
  slides: [],
  slideIndex: 0,
  showTranscript: false,
  showTypeInput: false,
  liveWpm: null,
  setupTemplateId: null,
  soundcheckMode: false,
  soundcheckText: "",
  pickerTab: "practice",
  founderNoteOpen: false,
  authOpen: false,
};

const main = document.getElementById("main");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("greenRoomTheme", theme);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
(() => {
  const saved = localStorage.getItem("greenRoomTheme");
  const preferred = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
})();
document.getElementById("themeToggle").onclick = toggleTheme;
document.getElementById("brandHome").onclick = goHome;
document.getElementById("founderNoteBtn").onclick = () => {
  S.founderNoteOpen = true;
  renderFounderNote();
};
document.addEventListener("pointerdown", (event) => {
  const menu = document.getElementById("headerUserMenu");
  if (!menu || menu.contains(event.target)) return;
  menu.classList.remove("open");
  document.getElementById("userMenuBtn")?.setAttribute("aria-expanded", "false");
});

const SESSION_COUNT_KEY = "greenRoomSessionCount";
function getSessionCount() {
  return Number(localStorage.getItem(SESSION_COUNT_KEY) || 0);
}
function incrementSessionCount() {
  const next = getSessionCount() + 1;
  localStorage.setItem(SESSION_COUNT_KEY, String(next));
  return next;
}
function renderHeaderUser() {
  const el = document.getElementById("headerUser");
  const founderLink = document.getElementById("founderNoteBtn");
  if (!el) return;
  if (!S.student) {
    el.hidden = true;
    el.innerHTML = "";
    if (founderLink) founderLink.hidden = false;
    return;
  }
  if (founderLink) founderLink.hidden = true;
  const count = getSessionCount();
  const badges = milestoneProgress();
  el.hidden = false;
  el.innerHTML = `
    <div class="header-user-menu" id="headerUserMenu">
      <button class="header-user-trigger" id="userMenuBtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="userMenuPopover">
        <div class="header-user-main"><b>${esc(S.student.name || "")}</b></div>
        <span>${badges.earned} of ${badges.total} badges · ${count} session${count === 1 ? "" : "s"}</span>
      </button>
      <div class="header-user-popover" id="userMenuPopover">
        <button class="logout-link" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>`;
  const menu = $("#headerUserMenu", el);
  const trigger = $("#userMenuBtn", el);
  trigger.onclick = () => {
    const open = menu.classList.toggle("open");
    trigger.setAttribute("aria-expanded", String(open));
  };
  $("#logoutBtn", el).onclick = logout;
}

function renderFounderNote() {
  const root = document.getElementById("founderNoteRoot");
  if (!root) return;
  if (!S.founderNoteOpen) {
    root.innerHTML = "";
    return;
  }
  root.innerHTML = `
    <div class="rm-modal-backdrop" id="founderBackdrop" role="presentation">
      <section class="rm-founder-modal" role="dialog" aria-modal="true" aria-labelledby="founderTitle">
        <button class="rm-modal-close" id="founderClose" type="button" aria-label="Close founder note">×</button>
        <h2 id="founderTitle">Why I made this</h2>
        <p>I built Prelight because I know how hard it can be to speak when the room suddenly feels bigger than you. A few years ago, I struggled with public speaking myself. I would know what I wanted to say, then lose it once people were watching.</p>
        <p>Practicing helped, but only when it felt close to the real moment: a question after a pitch, a panel that pushes back, a quiet audience member waiting for the point. I wanted to make a space where people could rehearse those moments before they actually matter.</p>
        <p class="signoff">This is a practice room for anyone building confidence one rep at a time.</p>
      </section>
    </div>`;
  $("#founderClose").onclick = closeFounderNote;
  $("#founderBackdrop").onclick = (e) => {
    if (e.target.id === "founderBackdrop") closeFounderNote();
  };
  document.addEventListener("keydown", handleFounderNoteKeydown);
}

function closeFounderNote() {
  S.founderNoteOpen = false;
  document.removeEventListener("keydown", handleFounderNoteKeydown);
  renderFounderNote();
  document.getElementById("founderNoteBtn")?.focus();
}

function handleFounderNoteKeydown(e) {
  if (e.key === "Escape" && S.founderNoteOpen) closeFounderNote();
}

function logout() {
  if (S.micOn) stopMicCapture({ cancel: true });
  stopCamPreview();
  localStorage.removeItem("greenRoomToken");
  S.token = "";
  S.student = null;
  S.screen = "gate";
  S.authMode = "login";
  S.practiceTemplate = null;
  S.practiceSessionId = null;
  S.replaySession = null;
  S.replayLoading = false;
  S.replayReturnScreen = "picker";
  S.profile = null;
  S.profileLoading = false;
  S.profileError = null;
  S.activeQuest = null;
  S.challengeModifier = null;
  S.questCompleted = false;
  S.newlyUnlockedModifier = null;
  S.practiceLog = [];
  S.micOn = false;
  S.sending = false;
  S.rubric = null;
  S.bestLine = null;
  S.whyItLanded = null;
  S.viaFreeText = false;
  S.slides = [];
  S.slideIndex = 0;
  S.showTranscript = false;
  S.showTypeInput = false;
  S.liveWpm = null;
  S.setupTemplateId = null;
  S.soundcheckMode = false;
  S.soundcheckText = "";
  S.authOpen = false;
  renderHeaderUser();
  render();
}

const SESSION_HISTORY_KEY = "greenRoomSessionHistory";
function getSessionHistory() {
  try { return JSON.parse(localStorage.getItem(SESSION_HISTORY_KEY) || "[]"); } catch { return []; }
}
function pushSessionHistory(entry) {
  const list = getSessionHistory();
  const withoutDuplicate = entry?.sessionId ? list.filter((item) => item?.sessionId !== entry.sessionId) : list;
  withoutDuplicate.unshift(entry);
  localStorage.setItem(SESSION_HISTORY_KEY, JSON.stringify(withoutDuplicate.slice(0, 20)));
}
function mergeServerHistory(serverSessions) {
  const list = PrelightSessionHistory.mergeSessionHistory(getSessionHistory(), serverSessions, 20);
  localStorage.setItem(SESSION_HISTORY_KEY, JSON.stringify(list));
  return list;
}
async function loadServerHistory() {
  if (!S.token) return;
  try {
    const result = await api("/api/sessions?limit=20");
    mergeServerHistory(result.sessions);
  } catch (e) {
    console.warn("server session history unavailable; using local history", e.message || e);
  }
}
function firstSentence(s, maxLen) {
  const trimmed = String(s || "").trim();
  const m = trimmed.match(/^[^.!?]*[.!?]/);
  const sentence = m ? m[0] : trimmed;
  return sentence.length > maxLen ? sentence.slice(0, maxLen - 1) + "…" : sentence;
}

const THINKING_HTML = `<span class="rm-thinking"><span></span><span></span><span></span></span>`;

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

async function api(path, body, method) {
  const headers = body ? { "Content-Type": "application/json" } : {};
  if (S.token) headers.Authorization = `Bearer ${S.token}`;
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"),
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}

function err(e) {
  const el = $("#err");
  if (el) el.innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
}
function status(msg) {
  const el = $("#status");
  if (el) el.textContent = msg || "";
}

function render() {
  if (S.screen === "studio") { document.getElementById("legacyStyles").media = "not all"; renderStudio(); return; }
  document.getElementById("legacyStyles").media = "all";
  document.body.classList.remove("prelight-page");
  document.body.classList.toggle("landing-page", S.screen === "gate");
  if (S.screen === "picker") renderPicker();
  else if (S.screen === "soundcheck") renderSoundcheck();
  else if (S.screen === "setup") renderSetup();
  else if (S.screen === "practice") (S.viaFreeText ? renderPracticeChat() : renderPracticeStaged());
  else if (S.screen === "practiceEnd") renderPracticeEnd();
  else if (S.screen === "replay") renderReplay();
  else renderGate();
}

function renderGate() {
  main.innerHTML = `
    <section class="rm-landing">
      <div class="rm-landing-inner">
        <img class="rm-landing-logo" src="/prelight-mark.svg" alt="Prelight" />
        <p class="rm-landing-brand">Prelight</p>
        <div class="rm-live-stage">
          <div class="rm-live-bubble">Tell me what you're practicing.</div>
          ${sceneFacilitator()}
        </div>
        <h2>Practice before the room is real.</h2>
        <p class="rm-landing-copy">A private space to rehearse speaking out loud.</p>
        <div class="rm-landing-actions">
          <button class="rm-landing-btn primary" id="startPractice" type="button">Start a practice</button>
          <button class="rm-landing-btn" id="haveAccount" type="button">I have an account</button>
        </div>
        <p class="rm-landing-note">No grades. Just practice.</p>
      </div>
    </section>
    <div id="authRoot"></div>`;
  $("#startPractice").onclick = () => openAuth("register");
  $("#haveAccount").onclick = () => openAuth("login");
  if (S.authOpen) renderAuthDialog();
}

function openAuth(mode) {
  S.authMode = mode;
  S.authOpen = true;
  render();
}

function closeAuth() {
  S.authOpen = false;
  render();
}

function renderAuthDialog() {
  const root = $("#authRoot");
  if (!root) return;
  root.innerHTML = `
    <div class="rm-auth-backdrop" id="authBackdrop" role="presentation">
      <section class="rm-auth-dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="rm-auth-close" id="authClose" type="button" aria-label="Close account dialog">×</button>
        <img class="pl-character" src="/prelight-hermes.png" width="72" height="72" alt=""/>
        <h2 id="authTitle">${S.authMode === "register" ? "Your room is ready." : "Welcome back."}</h2>
        <p class="sub">${S.authMode === "register" ? "Create your private Prelight account to start your first practice." : "Sign in to return to your practice path."}</p>
        ${S.authMode === "register" ? `<label>Name <div class="input-wrap"><input id="name" placeholder="Your name" autocomplete="name" /></div></label>` : ""}
        <label>Email <div class="input-wrap"><input id="email" type="email" placeholder="you@example.com" autocomplete="email" /></div></label>
        <label>Password <div class="input-wrap"><input id="pass" type="password" placeholder="At least 8 characters" autocomplete="current-password" /></div></label>
        ${S.authMode === "register" ? `<label>Invite code <div class="input-wrap"><input id="inviteCode" type="password" placeholder="Your invite code" autocomplete="off" /></div></label>` : ""}
        <div class="actions">
          <button class="btn primary" id="go">${S.authMode === "register" ? "Enter Prelight" : "Sign in"}</button>
          <button class="btn ghost" id="sw">${S.authMode === "register" ? "I have an account" : "Create an account"}</button>
        </div>
        <p class="muted" id="status" style="margin-top:12px"></p>
        <div id="err"></div>
      </section>
    </div>`;
  $("#authClose").onclick = closeAuth;
  $("#authBackdrop").onclick = (e) => { if (e.target.id === "authBackdrop") closeAuth(); };
  $("#sw").onclick = () => { S.authMode = S.authMode === "register" ? "login" : "register"; render(); };
  $("#go").onclick = async () => {
    try {
      status(S.authMode === "register" ? "Checking you in…" : "Signing you in…");
      const email = $("#email").value.trim();
      const password = $("#pass").value;
      if (!email) throw new Error("Please enter your email");
      if (password.length < 8) throw new Error("Please enter a password with at least 8 characters");
      let j;
      if (S.authMode === "register") {
        const name = $("#name").value.trim();
        const inviteCode = $("#inviteCode").value.trim();
        if (!name) throw new Error("Please enter your name");
        j = await api("/api/auth/register", { name, email, password, inviteCode });
      } else {
        j = await api("/api/auth/login", { email, password });
      }
      S.token = j.token;
      localStorage.setItem("greenRoomToken", j.token);
      S.student = j.student;
      S.screen = "studio";
      S.authOpen = false;
      location.assign("/studio");
    } catch (e) { err(e); }
  };
}

// History is capped at 20 entries, so a milestone's evidence eventually falls off
// the end. Earning is permanent: remember the ids so an old badge is never revoked.
const EARNED_MILESTONES_KEY = "greenRoomEarnedMilestones";
function rememberedMilestoneIds() {
  try {
    const v = JSON.parse(localStorage.getItem(EARNED_MILESTONES_KEY) || "[]");
    return Array.isArray(v) ? v.filter((id) => typeof id === "string") : [];
  } catch { return []; }
}
function milestoneProgress(history = getSessionHistory()) {
  const remembered = new Set(rememberedMilestoneIds());
  const milestones = GreenRoomProgress.milestoneProgress(history).milestones
    .map((m) => ({ ...m, earned: m.earned || remembered.has(m.id) }));
  const earnedIds = milestones.filter((m) => m.earned).map((m) => m.id);
  try { localStorage.setItem(EARNED_MILESTONES_KEY, JSON.stringify(earnedIds)); } catch {}
  return {
    milestones,
    earned: earnedIds.length,
    total: milestones.length,
    next: milestones.find((m) => !m.earned) || null,
  };
}

function careerProgress(history = getSessionHistory()) {
  const p = milestoneProgress(history);
  return {
    count: getSessionCount(),
    uniqueTemplates: GreenRoomProgress.distinctTemplates(history).size,
    earned: p.earned,
    total: p.total,
    milestones: p.milestones,
    next: p.next,
  };
}

function sparklineSvg(row) {
  const w = 140, h = 36, pad = 4;
  const vs = row.values;
  const lo = Math.min(...vs), hi = Math.max(...vs);
  const span = (hi - lo) || 1;
  const top = hi + span * 0.1, bottom = lo - span * 0.1;
  const x = (i) => pad + (i * (w - pad * 2)) / Math.max(1, vs.length - 1);
  const y = (v) => h - pad - ((v - bottom) / (top - bottom)) * (h - pad * 2);
  const pts = vs.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let band = "";
  if (row.band) {
    const yTop = y(Math.min(top, row.band.to));
    const yBot = y(Math.max(bottom, row.band.from));
    if (yBot > yTop) {
      band = `<rect x="0" y="${yTop.toFixed(1)}" width="${w}" height="${(yBot - yTop).toFixed(1)}" fill="var(--rm-sage)" opacity="0.15" />`;
    }
  }
  return `<svg class="rm-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${band}
    <polyline points="${pts}" fill="none" stroke="var(--rm-teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketchWobble)" />
    <circle cx="${x(vs.length - 1).toFixed(1)}" cy="${y(vs[vs.length - 1]).toFixed(1)}" r="3" fill="var(--rm-tan)" />
  </svg>`;
}

function maybeSoundCheck(intentFn) {
  if (localStorage.getItem(SOUND_CHECK_KEY)) { unlockSpeechAudio(); intentFn(); return; }
  pendingIntent = intentFn;
  S.soundcheckMode = true;
  S.soundcheckText = "";
  S.camDismissed = false;
  S.screen = "soundcheck";
  render();
}

function finishSoundcheck() {
  unlockSpeechAudio();
  localStorage.setItem(SOUND_CHECK_KEY, "1");
  S.soundcheckMode = false;
  S.soundcheckText = "";
  stopCamPreview();
  const intent = pendingIntent;
  pendingIntent = null;
  if (intent) intent();
  else { S.screen = "picker"; render(); }
}

async function startPracticeDirect(templateId, setupAnswer, questId, challengeModifier, context = {}) {
  try {
    status("Setting the scene…");
    const t = CARD_TEMPLATES.find((x) => x.id === templateId);
    const description = setupAnswer ? `${t.defaultDescription} Specifically: ${setupAnswer}` : t.defaultDescription;
    const started = await api("/api/practice/start", { studentId: S.token, templateId, description, setupAnswer, context, questId, challengeModifier });
    beginPracticeSession(started, false, questId, challengeModifier);
  } catch (e) { err(e); }
}

async function startPracticeFromDescription() {
  try {
    const description = $("#freeDesc").value.trim();
    if (!description) { err(new Error("Describe your scenario first")); return; }
    status("Figuring out the best fit…");
    const inferred = await api("/api/practice/infer-scenario", { studentId: S.token, description });
    const started = await api("/api/practice/start", { studentId: S.token, templateId: inferred.templateId, description });
    beginPracticeSession(started, true, null, null);
  } catch (e) { err(e); }
}

function beginPracticeSession(started, viaFreeText, questId, challengeModifier) {
  S.practiceTemplate = started.practice;
  S.practiceSessionId = started.practice.sessionId || null;
  S.activeQuest = GreenRoomGame.questById(questId);
  S.challengeModifier = challengeModifier || null;
  S.questCompleted = false;
  S.newlyUnlockedModifier = null;
  S.practiceLog = [{ role: "agent", name: "Facilitator", text: started.opener }];
  S.sending = false;
  S.viaFreeText = !!viaFreeText;
  S.camDismissed = false;
  S.showTranscript = false;
  S.showTypeInput = false;
  S.liveWpm = null;
  S.slides.forEach((u) => URL.revokeObjectURL(u));
  S.slides = [];
  S.slideIndex = 0;
  S.screen = "practice";
  render();
  speak(started.opener, "facilitator");
}

let camStream = null;
let camRequesting = false;

// Fixed-position corner per template, chosen to stay clear of that
// template's own scene/controls rather than one hardcoded spot for all:
// pitch gets the slide-shuffle row along the bottom, so its camera moves
// left of center; interview reads naturally as "your own tile" beside the
// video call, so it sits top-right instead of bottom.
const CAM_POSITION_BY_TEMPLATE = {
  exam_viva: "pos-br",
  pitch: "pos-bl",
  interview: "pos-tr",
  public_speech: "pos-br",
  casual: "pos-bl",
};

function camWidgetHtml() {
  if (S.camDismissed) return "";
  const posClass = CAM_POSITION_BY_TEMPLATE[S.practiceTemplate?.templateId] || "pos-br";
  return `<div class="rm-cam ${posClass}" id="camWrap">
    <video id="camVideo" autoplay playsinline muted></video>
    <button class="rm-cam-close" id="camClose" title="Turn off camera">✕</button>
  </div>`;
}

function wireCamWidget() {
  const closeEl = $("#camClose");
  if (closeEl) closeEl.onclick = dismissCamPreview;
  mountCamPreview();
}

function mountCamPreview() {
  if (S.camDismissed || !navigator.mediaDevices?.getUserMedia) return;
  const videoEl = $("#camVideo");
  if (!videoEl) return;
  if (camStream) {
    videoEl.srcObject = camStream;
    return;
  }
  if (camRequesting) return;
  camRequesting = true;
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then((stream) => {
      camRequesting = false;
      if (S.camDismissed) { stream.getTracks().forEach((t) => t.stop()); return; }
      camStream = stream;
      const el = $("#camVideo");
      if (el) el.srcObject = stream;
      else stream.getTracks().forEach((t) => t.stop());
    })
    .catch((e) => {
      camRequesting = false;
      console.error("camera preview unavailable", e);
    });
}

function stopCamPreview() {
  if (camStream) {
    camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
  }
}

function dismissCamPreview() {
  S.camDismissed = true;
  stopCamPreview();
  render();
}

function handleSlideFiles(files) {
  const all = [...files];
  const images = all.filter((f) => f.type.startsWith("image/"));
  if (!all.length) return;
  if (!images.length) {
    err(new Error("That file type isn't supported here - export your slides as images (PNG or JPG) and upload those instead."));
    return;
  }
  const urls = images.map((f) => URL.createObjectURL(f));
  S.slides.forEach((u) => URL.revokeObjectURL(u));
  S.slides = urls;
  S.slideIndex = 0;
  render();
}

    </div>`;
  }
  return `<div class="rm-slide-bar">
    <button class="rm-btn ghost sm" id="slidePrev">◂ Prev</button>
    <span>Slide ${S.slideIndex + 1} of ${S.slides.length}</span>

}

    if (m.role === "student") return `<div class="rm-bubble me"><span class="who">You</span>${esc(m.text)}</div>`;
    return `<div class="rm-bubble them"><span class="who">${esc(m.name || "")}</span>${esc(m.text)}</div>`;
  }).join("") + (S.sending ? `<div class="rm-bubble sys">${THINKING_HTML}</div>` : "");
}

function discardPracticeSession() {
  const hasProgress = S.practiceLog.some((m) => m.role === "student");
  if (hasProgress && !confirm("Leave this practice session? Your conversation won't be saved.")) return;
  if (S.micOn) stopMicCapture({ cancel: true });
  stopCamPreview();
  S.practiceLog = [];
  S.practiceTemplate = null;
  S.showTranscript = false;
  S.showTypeInput = false;
  S.liveWpm = null;
  S.screen = "picker";
  render();
}

function goHome() {
  if (S.screen === "practice") { discardPracticeSession(); return; }
  if (S.screen === "gate") { if (S.authOpen) closeAuth(); return; }
  if (S.screen === "picker") return;
  S.screen = S.student ? "picker" : "gate";
  render();
}

async function sendPracticeMessage(text, durationSec) {
  if (S.sending) return;
  S.practiceLog.push({ role: "student", text });
  S.sending = true;
  render();
  try {
    const body = { studentId: S.token, text };
    if (typeof durationSec === "number" && durationSec > 0) body.durationSec = durationSec;
    const j = await api("/api/practice/message", body);
    for (const r of j.responses) S.practiceLog.push({ role: "agent", name: r.name, text: r.reply });
    S.sending = false;
    render();
    speakSequence(j.responses.map((r) => ({ text: r.reply, personaId: r.personaId })));
  } catch (e) {
    S.sending = false;
    render();
    err(e);
  }
}

function updateLiveWpm(text, durationSec) {
  if (text && durationSec >= 0.5) {
    const wordCount = text.split(/\s+/).filter(Boolean).length;
    S.liveWpm = Math.round(wordCount / (durationSec / 60));
  }
}

async function polishSpokenTranscript(text) {
  try {
    const j = await api("/api/practice/polish-transcript", { studentId: S.token, text });
    return (j.text || text).trim();
  } catch (e) {
    console.warn("transcript polish failed; using raw transcript", e);
    return text;
  }
}

async function sendSpokenPracticeMessage(rawText, durationSec) {
  status("Cleaning up transcript...");
  const text = await polishSpokenTranscript(rawText);
  updateLiveWpm(text, durationSec);
  if (text) sendPracticeMessage(text, durationSec);
}

async function finishSoundcheckTranscript(rawText) {
  const text = await polishSpokenTranscript(rawText);
  S.soundcheckText = text;
  render();
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micStopRequested = false;
let micFatalError = false;
let micUsingRecorder = false;
let micRecorder = null;
let micRecordingStream = null;
let micAudioChunks = [];
let micCancelTurn = false;
let micAutoStopTimer = null;
const MAX_RECORDING_SECONDS = 45;
const micTranscriptAccumulator = createMicTranscriptAccumulator();

function toggleMic() {
  if (S.micOn) {
    stopMicCapture();
    return;
  }
  startMicCapture();
}

function recorderMimeType() {
  if (!window.MediaRecorder) return "";
  for (const type of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }
  return "";
}

async function transcribeRecordedAudio(blob) {
  status("Transcribing audio...");
  const durationSec = S.lastMicDurationSec || 0;
  const qs = new URLSearchParams({ durationSec: String(Math.round(durationSec * 10) / 10) });
  const res = await fetch(`/api/practice/transcribe-audio?${qs.toString()}`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${S.token}`,
      "Content-Type": blob.type || "audio/webm",
      "X-Prelight-Duration-Sec": String(durationSec),
    },
    body: blob,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || "Audio transcription failed");
  return (j.text || "").trim();
}

async function finishMicTurnFromText(rawText, durationSec) {
  if (S.soundcheckMode) {
    render();
    if (rawText) finishSoundcheckTranscript(rawText);
    return;
  }
  render();
  if (rawText) sendSpokenPracticeMessage(rawText, durationSec);
  else if (micFatalError) alert("Couldn't access the microphone. Check your browser's mic permission for this site.");
}

function stopMicTracks() {
  if (micAutoStopTimer) {
    clearTimeout(micAutoStopTimer);
    micAutoStopTimer = null;
  }
  if (micRecordingStream) {
    micRecordingStream.getTracks().forEach((t) => t.stop());
    micRecordingStream = null;
  }
}

function stopMicCapture({ cancel = false } = {}) {
  micStopRequested = true;
  micCancelTurn = cancel;
  if (micUsingRecorder && micRecorder && micRecorder.state !== "inactive") {
    try { micRecorder.stop(); } catch (e) { console.error("recorder stop failed", e); }
  }
  if (recognition) {
    try { recognition.stop(); } catch {}
  }
}

async function startMicCapture() {
  micStopRequested = false;
  micFatalError = false;
  micCancelTurn = false;
  micTranscriptAccumulator.reset();
  micAudioChunks = [];

  if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
        video: false,
      });
      const mimeType = recorderMimeType();
      micRecordingStream = stream;
      micUsingRecorder = true;
      micRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      micRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) micAudioChunks.push(e.data);
      };
      micRecorder.onstop = async () => {
        const durationSec = S.micStartedAt ? (performance.now() - S.micStartedAt) / 1000 : 0;
        S.lastMicDurationSec = durationSec;
        const blob = new Blob(micAudioChunks, { type: micRecorder.mimeType || mimeType || "audio/webm" });
        S.micOn = false;
        S.micStartedAt = 0;
        render();
        stopMicTracks();
        if (micCancelTurn) {
          micCancelTurn = false;
          return;
        }

        if (!blob.size) {
          status("I couldn't record any audio. Check the mic permission and try again.");
          return;
        }
        let transcribedText = "";
        try {
          transcribedText = await transcribeRecordedAudio(blob);
        } catch (e) {
          console.error("audio transcription failed", e);
          status(e.message || "Audio transcription failed. Try again or type it instead.");
          return;
        }
        if (!transcribedText) {
          status("I couldn't catch speech clearly. Try again or type it instead.");
          return;
        }
        await finishMicTurnFromText(transcribedText, durationSec);
      };
      S.micOn = true;
      S.micStartedAt = performance.now();
      render();
      micRecorder.start(250);
      micAutoStopTimer = setTimeout(() => {
        if (S.micOn) {
          status(`Stopping at ${MAX_RECORDING_SECONDS} seconds to keep audio costs under control...`);
          stopMicCapture();
        }
      }, MAX_RECORDING_SECONDS * 1000);
      return;
    } catch (e) {
      console.error("audio recorder unavailable", e);
      stopMicTracks();
      micUsingRecorder = false;
      micRecorder = null;
      micAudioChunks = [];
    }
  }

  if (!SpeechRec) {
    alert("Speech recognition isn't supported in this browser. Try Chrome, or type instead.");
    return;
  }
  startRecognition({ backupOnly: false });
}

// Browser SpeechRecognition is now only the primary path when MediaRecorder is
// unavailable. During recorded turns, it quietly provides a last-ditch fallback.
function startRecognition({ backupOnly = false } = {}) {
  recognition = new SpeechRec();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.onstart = () => {
    if (backupOnly) return;
    S.micOn = true;
    if (!S.micStartedAt) S.micStartedAt = performance.now();
    render();
  };
  recognition.onresult = (e) => {
    micTranscriptAccumulator.recordResultEvent(e);
  };
  recognition.onerror = (e) => {
    console.error("speech recognition error", e.error);
    // Permission/device errors are fatal - don't loop restarting forever.
    // Everything else (no-speech, network blips, aborted) is transient;
    // onend decides whether to restart.
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
      micFatalError = true;
      micStopRequested = true;
    }
  };
  recognition.onend = () => {
    micTranscriptAccumulator.flushSession();
    if (backupOnly) return;
    if (micStopRequested) {
      S.micOn = false;
      const durationSec = S.micStartedAt ? (performance.now() - S.micStartedAt) / 1000 : 0;
      S.micStartedAt = 0;
      const text = micTranscriptAccumulator.text();
      finishMicTurnFromText(text, durationSec);
    } else {
      // Unexpected auto-stop mid-thought - restart without the student noticing.
      // A short delay avoids some browsers throwing if start() is called too
      // soon after the previous session's onend.
      setTimeout(() => {
        try { recognition.start(); } catch (e) { console.error("mic restart failed", e); }
      }, 50);
    }
  };
  try { recognition.start(); } catch (e) { console.error(e); }
}

const SILENT_AUDIO_DATA = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIABAAgAZGF0YQAAAAA=";
let speechAudio = null;

function getSpeechAudio() {
  if (speechAudio) return speechAudio;
  speechAudio = document.createElement("audio");
  speechAudio.preload = "auto";
  speechAudio.setAttribute("playsinline", "");
  speechAudio.setAttribute("aria-hidden", "true");
  speechAudio.style.display = "none";
  document.body.appendChild(speechAudio);
  return speechAudio;
}

function unlockSpeechAudio() {
  const audio = getSpeechAudio();
  if (audio.src === SILENT_AUDIO_DATA) return;
  audio.src = SILENT_AUDIO_DATA;
  audio.volume = 0.01;
  audio.play().catch(() => {});
}

function playAudioBlob(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = getSpeechAudio();
    audio.pause();
    audio.src = url;
    audio.volume = 1;
    const done = () => {
      audio.removeEventListener("ended", done);
      audio.removeEventListener("error", done);
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.addEventListener("ended", done);
    audio.addEventListener("error", done);
    audio.play().catch(done);
  });
}

async function speak(text, personaId) {
  if (!text) return;
  try {
    const res = await fetch("/api/practice/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId: S.token, text, personaId: personaId || "facilitator" }),
    });
    if (!res.ok) return;
    const blob = await res.blob();
    await playAudioBlob(blob);
  } catch (e) {
    console.error("speak failed", e);
  }
}

async function speakSequence(items) {
  for (const item of items) await speak(item.text, item.personaId);
}

async function endPracticeSession() {
  try {
    status("Putting together your feedback…");
    const j = await api("/api/practice/end", { studentId: S.token });
    stopCamPreview();
    S.rubric = j.rubric;
    S.bestLine = j.bestLine || null;
    S.whyItLanded = j.whyItLanded || null;
    S.replaySession = j.session || null;
    S.screen = "practiceEnd";
    incrementSessionCount();
    const beforeHistory = getSessionHistory();
    const beforeProgress = careerProgress(beforeHistory);
    const beforeGame = gameState(beforeHistory, beforeProgress);
    const signals = GreenRoomProgress.extractSignals(j.raw);
    const historyEntry = {
      sessionId: j.sessionId || S.practiceSessionId || null,
      templateId: S.practiceTemplate?.templateId || "",
      templateName: S.practiceTemplate?.templateName || "Practice session",
      date: new Date().toISOString(),
      takeaway: firstSentence(j.rubric?.contentCorrespondence || j.rubric?.articulation || "", 90),
      rubric: j.rubric,
      signals,
      viaFreeText: S.viaFreeText === true,
      bestLine: j.bestLine || null,
      replayAvailable: Boolean(j.session?.events?.some((event) => event?.type === "turn" && event.studentText)),
      transcript: S.practiceLog.filter((m) => m.role === "student").map((m) => m.text).filter(Boolean).join(" "),
      questId: S.activeQuest?.id || null,
      challengeModifier: S.challengeModifier || null,
    };
    pushSessionHistory(historyEntry);
    S.questCompleted = S.activeQuest ? GreenRoomGame.isQuestComplete(S.activeQuest, [historyEntry]) : false;
    const afterHistory = getSessionHistory();
    const afterGame = gameState(afterHistory, careerProgress(afterHistory));
    S.newlyUnlockedModifier = afterGame.unlockedModifierIds.find((id) => !beforeGame.unlockedModifierIds.includes(id)) || null;
    render();
    renderHeaderUser();
  } catch (e) { err(e); }
}

function curtainCallHtml() {
  const line = (S.bestLine || "").trim();
  if (!line) return "";
  const tpl = CARD_TEMPLATES.find((t) => t.id === S.practiceTemplate?.templateId);
  const listener = tpl?.listener || "room";
  const why = (S.whyItLanded || "").trim();
  return `<div class="rm-curtain">
    <div class="rm-curtain-eyebrow">What the ${esc(listener)} heard</div>
    <blockquote class="rm-curtain-quote">“${esc(line)}”</blockquote>
    ${why ? `<p class="rm-curtain-why">${esc(why)}</p>` : ""}
  </div>`;
}

function replayTimeLabel(moment, startedAt) {
  const start = Date.parse(startedAt || "");
  const occurred = Date.parse(moment.occurredAt || "");
  if (!Number.isFinite(start) || !Number.isFinite(occurred) || occurred < start) return `Turn ${moment.sequence}`;
  const seconds = Math.max(0, Math.round((occurred - start) / 1000));
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
}

function replayLineHtml(entry) {
  const label = entry.role === "student" ? "You" : "Facilitator";
  return `<div class="rm-replay-line ${entry.role === "student" ? "student" : ""}">
    <b>${label}</b>
    <p>${esc(entry.text)}</p>
  </div>`;
}

function renderReplay() {
  if (S.replayLoading) {
    main.innerHTML = `<div class="rm-page"><div class="rm-topbar rm-replay-topbar"><b>Replay</b></div><p class="rm-sub">Opening your session…</p></div>`;
    return;
  }
  const replay = PrelightSessionReplay.buildReplayViewModel(S.replaySession);
  if (!replay) {
    main.innerHTML = `<div class="rm-page"><div class="rm-topbar rm-replay-topbar"><button class="rm-exit-btn" id="replayBack">← Back</button><b>Replay</b></div><p class="rm-sub">This session does not have replay data yet.</p></div>`;
    $("#replayBack").onclick = () => { S.screen = S.replayReturnScreen || "picker"; render(); };
    return;
  }
  main.innerHTML = `
    <div class="rm-page rm-replay-shell">
      <div class="rm-topbar rm-replay-topbar"><button class="rm-exit-btn" id="replayBack">← Back</button><b>Session replay</b></div>
      <h2 class="rm-h2">${esc(replay.title)}</h2>
      <div class="rm-replay-intro">
        <b>What happened in the room</b>
        <p>${esc(replay.scenario || "A saved Prelight practice session.")}</p>
        ${replay.context?.title || replay.context?.audience ? `<p class="rm-replay-context"><b>Prepared for:</b> ${esc([replay.context.title, replay.context.audience].filter(Boolean).join(" · "))}</p>` : ""}
      </div>
      ${replay.keyMoments.length ? `<div class="rm-replay-moments">
        ${replay.keyMoments.map((moment) => `<article class="rm-replay-moment">
          <div class="rm-replay-moment-head"><b>${esc(moment.label)}</b><span>${esc(replayTimeLabel(moment, replay.startedAt))}</span></div>
          <div class="rm-replay-label">Facilitator</div>
          <blockquote>${esc(moment.facilitatorText)}</blockquote>
          <div class="rm-replay-label">Your response</div>
          <blockquote>${esc(moment.userText)}</blockquote>
          <p class="rm-replay-note"><b>Prelight noticed:</b> ${esc(moment.observation)}<br><b>Try next time:</b> ${esc(moment.suggestion)}</p>
        </article>`).join("")}
      </div>` : `<p class="rm-replay-empty">No standout moments were marked in this session. The full conversation is still here if you want to revisit it.</p>`}
      <details class="rm-replay-transcript">
        <summary>View full conversation</summary>
        <div class="rm-replay-transcript-list">${replay.transcript.map(replayLineHtml).join("") || `<p class="rm-replay-empty">No conversation was saved for this session.</p>`}</div>
      </details>
    </div>`;
  $("#replayBack").onclick = () => { S.screen = S.replayReturnScreen || "picker"; render(); };
}

function openReplayForSession(sessionId) {
  if (!sessionId) return;
  S.replayReturnScreen = "picker";
  S.replayLoading = true;
  S.screen = "replay";
  render();
  api(`/api/sessions/${encodeURIComponent(sessionId)}`)
    .then((result) => { S.replaySession = result.session; S.replayLoading = false; render(); })
    .catch((e) => { S.replayLoading = false; S.screen = "picker"; S.pickerTab = "history"; render(); err(e); });
}

function completionNoteHtml() {
  if (!S.questCompleted && !S.newlyUnlockedModifier) return "";
  const quest = S.activeQuest;
  const modifier = S.newlyUnlockedModifier ? GreenRoomGame.modifierById(S.newlyUnlockedModifier) : null;
  return `<div class="rm-completion">
    ${S.questCompleted ? `<b>Rep complete${quest ? `: ${esc(quest.label)}` : ""}</b><p>You gave that skill a real turn. It is now part of your practice history.</p>` : ""}
    ${modifier ? `<b>${esc(modifier.label)} is open</b><p>${esc(modifier.desc)} Find it on your Career Path.</p>` : ""}
  </div>`;
}

function renderPracticeEnd() {
  const r = S.rubric || {};
  const progressNote = improvementNote(getSessionHistory());
  main.innerHTML = `
    <div class="rm-page">
      <div class="rm-topbar"><b>How it went</b></div>
      <h2 class="rm-h2">Nice work, ${esc(S.student?.name || "")}</h2>
      <p class="rm-sub">Here's how your practice session went - no scores, just notes to build on.</p>
      ${completionNoteHtml()}
      ${curtainCallHtml()}
      <div class="rm-rubric">
        ${progressNote ? `<div class="blk progress"><h4>Progress over time</h4><p>${esc(progressNote)}</p></div>` : ""}
        <div class="blk"><h4>Articulation</h4><p>${esc(r.articulation || "-")}</p></div>
        <div class="blk"><h4>Engagement</h4><p>${esc(r.engagement || "-")}</p></div>
        <div class="blk"><h4>Content correspondence</h4><p>${esc(r.contentCorrespondence || "-")}</p></div>
      </div>
      ${S.replaySession ? `<div class="actions" style="justify-content:center;margin-top:18px"><button class="rm-btn ghost" id="reviewMoments">Review key moments</button></div>` : ""}
      <div class="actions" style="justify-content:center;margin-top:20px">
        <button class="rm-btn primary" id="again">Practice again</button>
      </div>
    </div>`;
  $("#again").onclick = () => {
    S.screen = "picker";
    S.practiceLog = [];
    S.rubric = null;
    S.bestLine = null;
    S.whyItLanded = null;
    S.replaySession = null;
    render();
  };
  $("#reviewMoments")?.addEventListener("click", () => {
    S.replayReturnScreen = "practiceEnd";
    S.replayLoading = false;
    S.screen = "replay";
    render();
  });
}

function improvementNote(history) {
  if (!history || history.length < 2) return "";
  const current = history[0];
  const previous = history.slice(1).find((h) => h.rubric);
  if (!current?.rubric || !previous?.rubric) return "";
  const currentWords = `${current.rubric.articulation || ""} ${current.rubric.engagement || ""} ${current.rubric.contentCorrespondence || ""}`.toLowerCase();
  const previousWords = `${previous.rubric.articulation || ""} ${previous.rubric.engagement || ""} ${previous.rubric.contentCorrespondence || ""}`.toLowerCase();
  const strengths = [
    ["specificity", ["specific", "concrete", "example", "detail"]],
    ["focus", ["focused", "relevant", "on track", "correspondence"]],
    ["pace", ["pace", "wpm", "rushed", "hesitant", "conversational"]],
    ["engagement", ["engaged", "responsive", "answered", "follow-up"]],
    ["clarity", ["clear", "structured", "articulation", "concise"]],
  ];
  const gained = strengths.find(([_, words]) => words.some((w) => currentWords.includes(w)) && !words.some((w) => previousWords.includes(w)));
  if (gained) return `Compared with your previous ${previous.templateName || "session"}, this feedback shows stronger ${gained[0]}. Keep stacking that into the next rep.`;
  return `You now have ${history.length} saved sessions, so your feedback is starting to show patterns across practice instead of only one performance.`;
}

(async () => {
  render();
  if (S.token) {
    try {
      const j = await api("/api/student/me");
      S.student = j.student;
      S.screen = "studio";
      await loadServerHistory();
    } catch {
      localStorage.removeItem("greenRoomToken");
      S.token = "";
      S.screen = "studio";
    }
  }
  render();
  renderHeaderUser();
})();
</script>
